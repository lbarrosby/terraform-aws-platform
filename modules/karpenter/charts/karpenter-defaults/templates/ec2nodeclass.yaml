apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.nodeClass.name }}
spec:
  role: {{ required "nodeClass.role is required" .Values.nodeClass.role | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.nodeClass.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "nodeClass.discoveryTag is required" .Values.nodeClass.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.nodeClass.discoveryTag | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: {{ ternary "/dev/xvdb" "/dev/xvda" (hasPrefix "bottlerocket" .Values.nodeClass.amiAlias) }}
      ebs:
        volumeSize: {{ printf "%dGi" (int .Values.nodeClass.rootVolumeGiB) }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  {{- with .Values.nodeClass.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
