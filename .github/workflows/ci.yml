name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=docker depName=hashicorp/terraform
  TF_VERSION: "1.14.8"
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: "v0.65.0"
  # renovate: datasource=github-releases depName=terraform-docs/terraform-docs
  TERRAFORM_DOCS_VERSION: "v0.24.0"
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "v0.76.1"
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate + test (${{ matrix.dir }}, tf ${{ matrix.terraform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/eks-cluster
          - modules/karpenter
          - modules/pod-identity-role
          - modules/vpc
          - examples/complete
        terraform:
          - "1.11.4" # minimum supported (required_version)
          - "1.14.8"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf') }}
      - name: init
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate -no-color
      - name: test
        run: terraform test -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: init plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: lint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  docs:
    name: terraform-docs up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install terraform-docs
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo install /tmp/terraform-docs /usr/local/bin/terraform-docs
      - name: regenerate
        run: |
          for dir in modules/*/ examples/complete/; do
            terraform-docs --config .terraform-docs.yml "$dir"
          done
      - name: check diff
        run: |
          if ! git diff --exit-code -- '*.md'; then
            echo "::error::README out of date. Run: for d in modules/*/ examples/complete/; do terraform-docs -c .terraform-docs.yml \$d; done"
            exit 1
          fi

  security:
    name: trivy config
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install trivy
        run: |
          v="${TRIVY_VERSION#v}"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "${base}/trivy_${v}_Linux-64bit.tar.gz"
          curl -sSfLO "${base}/trivy_${v}_checksums.txt"
          grep " trivy_${v}_Linux-64bit.tar.gz$" "trivy_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${v}_Linux-64bit.tar.gz" trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version
      - name: trivy (sarif)
        run: trivy config --config trivy.yaml --format sarif --output trivy.sarif --exit-code 0 .
      - name: upload sarif
        if: always() && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy.sarif
          category: trivy-config
      - name: trivy (gate on HIGH/CRITICAL)
        run: trivy config --config trivy.yaml --exit-code 1 .
